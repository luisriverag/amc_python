[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amc-python"
version = "0.1.0"
description = "A portable Python movie catalog inspired by Ant Movie Catalog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "tkinterweb>=4.25"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["movie", "catalog", "ant-movie-catalog"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
amc = "amc.cli:main"
amc-gui = "amc.gui:main"
amc-web = "amc.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/amc", "tools"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/amc", "tools"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tkinterweb.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amc = ["py.typed"]
